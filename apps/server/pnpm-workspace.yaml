# Optional standalone allowBuilds when installing under apps/server with
# `pnpm install --ignore-workspace`. Note: pnpm 11 `--ignore-workspace` does
# **not** apply this file's allowBuilds — that path still needs
# `--config.dangerouslyAllowAllBuilds=true`. Preferred: install from monorepo
# root with `pnpm install --filter @qingzhan/server...` (root allowBuilds).
allowBuilds:
  "@parcel/watcher": true
  "@prisma/engines": true
  "@scarf/scarf": true
  argon2: true
  esbuild: true
  msgpackr-extract: true
  prisma: true

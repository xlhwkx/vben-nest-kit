# 青栈生产形态示例：server + Postgres 16 + Redis 7
# 用法（仓库根目录）：
#   1) 准备 .env.production（参考 .env.example；JWT/密码务必替换）
#   2) docker compose -f compose.prod.yml --env-file .env.production up -d --build
#
# 与开发用 docker-compose.yml 的区别：
# - 开发 compose：只起 PG+Redis，server 在宿主 pnpm start:dev；宿主端口可避开 5432/6379
# - 本文件：把 Nest server 也放进 Compose；DB/Redis 默认不映射到宿主（仅容器网）；
#   server 带 healthcheck、优雅退出依赖 SIGTERM（stop_grace_period）；可选启动时 migrate
#
# 切勿把含真实密钥的 .env.production 提交进 git。

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-qingzhan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-qingzhan}
    volumes:
      - qingzhan_prod_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [qingzhan]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ["sh", "-c", "redis-server --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - qingzhan_prod_redis:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [qingzhan]

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: qingzhan-server:${IMAGE_TAG:-local}
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${APP_PORT:-5320}:5320"
    environment:
      NODE_ENV: production
      APP_PORT: "5320"
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:5320}
      DATABASE_URL: postgresql://${POSTGRES_USER:-qingzhan}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-qingzhan}?schema=public
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?set JWT_REFRESH_SECRET}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-30m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-7d}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAME_SITE: ${COOKIE_SAME_SITE:-lax}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5666}
      THROTTLE_STORAGE: redis
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      METRICS_ENABLED: ${METRICS_ENABLED:-true}
      METRICS_TOKEN: ${METRICS_TOKEN:-}
      RUN_MIGRATE_ON_START: ${RUN_MIGRATE_ON_START:-true}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      UPLOAD_DIR: /app/uploads
      OTEL_ENABLED: ${OTEL_ENABLED:-false}
    volumes:
      - qingzhan_prod_uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:5320/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 50s
    networks: [qingzhan]

networks:
  qingzhan:

volumes:
  qingzhan_prod_pg:
  qingzhan_prod_redis:
  qingzhan_prod_uploads:

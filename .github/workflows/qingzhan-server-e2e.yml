# Qingzhan Nest server e2e — server-only job (full monorepo / frontend CI deferred).
# Does not gate on github.repository == vbenjs/... so forks/private remotes still run.
name: Qingzhan server e2e

on:
  push:
    branches: [main]
    paths:
      - 'apps/server/**'
      - '规则/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'scripts/postinstall-stub.mjs'
      - '.github/workflows/qingzhan-server-e2e.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/server/**'
      - '规则/**'
      - 'docker-compose.yml'
      - '.env.example'
      - 'pnpm-workspace.yaml'
      - 'pnpm-lock.yaml'
      - 'package.json'
      - 'scripts/postinstall-stub.mjs'
      - '.github/workflows/qingzhan-server-e2e.yml'

permissions:
  contents: read

concurrency:
  group: qingzhan-server-e2e-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Server build + e2e
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      CI: true
      TZ: Asia/Shanghai
      APP_PORT: "5320"
      NODE_ENV: test
      # Host ports match Compose defaults on clean GHA runners
      POSTGRES_USER: qingzhan
      POSTGRES_PASSWORD: qingzhan
      POSTGRES_DB: qingzhan
      POSTGRES_PORT: "5432"
      REDIS_PORT: "6379"
      REDIS_PASSWORD: qingzhan
      DATABASE_URL: postgresql://qingzhan:qingzhan@localhost:5432/qingzhan?schema=public
      REDIS_URL: redis://:qingzhan@localhost:6379/0
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      CORS_ORIGINS: http://localhost:5666
      APP_PUBLIC_URL: http://localhost:5320
      THROTTLE_STORAGE: redis
      THROTTLE_LIMIT: "10000"
      THROTTLE_LOGIN_LIMIT: "1000"
      AUTH_FAIL_MAX: "5"
      AUTH_FAIL_USER_MAX: "5"
      AUTH_FAIL_IP_MAX: "10000"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          # Nest 12 ships ESM; Jest 30 needs Node >=24.9 for require(esm)
          node-version: "24"

      - name: Random JWT secrets (never commit)
        shell: bash
        run: |
          echo "JWT_ACCESS_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
          echo "JWT_REFRESH_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Write root + apps/server .env
        shell: bash
        run: |
          cat > .env <<EOF
          APP_PORT=${APP_PORT}
          NODE_ENV=${NODE_ENV}
          POSTGRES_USER=${POSTGRES_USER}
          POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
          POSTGRES_DB=${POSTGRES_DB}
          POSTGRES_PORT=${POSTGRES_PORT}
          REDIS_PORT=${REDIS_PORT}
          REDIS_PASSWORD=${REDIS_PASSWORD}
          DATABASE_URL=${DATABASE_URL}
          REDIS_URL=${REDIS_URL}
          JWT_ACCESS_SECRET=${JWT_ACCESS_SECRET}
          JWT_REFRESH_SECRET=${JWT_REFRESH_SECRET}
          JWT_ACCESS_TTL=30m
          JWT_REFRESH_TTL=7d
          COOKIE_SECURE=${COOKIE_SECURE}
          COOKIE_SAME_SITE=${COOKIE_SAME_SITE}
          CORS_ORIGINS=${CORS_ORIGINS}
          APP_PUBLIC_URL=${APP_PUBLIC_URL}
          THROTTLE_STORAGE=${THROTTLE_STORAGE}
          THROTTLE_LIMIT=${THROTTLE_LIMIT}
          THROTTLE_LOGIN_LIMIT=${THROTTLE_LOGIN_LIMIT}
          AUTH_FAIL_MAX=${AUTH_FAIL_MAX}
          AUTH_FAIL_USER_MAX=${AUTH_FAIL_USER_MAX}
          AUTH_FAIL_IP_MAX=${AUTH_FAIL_IP_MAX}
          EOF
          cp .env apps/server/.env

      - name: Start Postgres 16 + Redis 7 (Compose, requirepass)
        run: docker compose up -d --wait

      - name: Install @qingzhan/server deps (workspace filter)
        # Root lockfile + root pnpm-workspace.yaml allowBuilds (argon2/prisma/...).
        # Do NOT use --ignore-workspace: pnpm 11 then skips allowBuilds and needs
        # --config.dangerouslyAllowAllBuilds=true. Filter keeps install scoped.
        # Filtered install leaves internal/* without deps — skip root `pnpm -r stub`.
        env:
          IGNORE_STUB: "1"
        run: pnpm install --frozen-lockfile --filter @qingzhan/server...

      - name: Prisma migrate + seed
        working-directory: apps/server
        run: |
          pnpm exec prisma generate
          pnpm exec prisma migrate deploy
          pnpm exec prisma db seed

      - name: Build
        working-directory: apps/server
        run: pnpm run build

      - name: E2E
        working-directory: apps/server
        run: pnpm test:e2e
